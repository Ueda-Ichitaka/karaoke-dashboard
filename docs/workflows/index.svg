<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 490" width="1250" height="490" role="img" aria-label="Overview: singers, contributors and admins use the dashboard&#x27;s pages; the dashboard reads the song library and keeps its own database; it exports broken.csv, song-requests.csv and genre-edits.tsv for the USDX Song Factory and playlists and move lists for UltraStar Manager and the scripts, which write into the library.">
<title>Karaoke Dashboard workflows</title>
<style>svg { --bg: #f3f4f1; --surface: #ffffff; --fg: #1d2421; --muted: #5c6862; --line: #36403b; --rule: #d5dad5; --lane: #e8ebe6; --file: #f7f8f5; --online: #2f62a8; --human: #a86412; --write: #b3361f; --db: #2c7a57; --tint-online: #e6eef9; --tint-human: #fbefdf; --tint-write: #fbe7e2; --tint-db: #e2f1e9; --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif; --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
text { font-family: var(--body); font-size: 12px; fill: var(--fg); }
.t-tool { font-family: var(--mono); font-size: 13px; font-weight: 600; }
.t-file { font-family: var(--mono); font-size: 12px; font-weight: 500; }
.t-small { font-size: 11px; fill: var(--muted); }
.t-lane { font-family: var(--display); font-size: 15px; font-weight: 700; }
.t-label { font-size: 11px; fill: var(--muted); }
.t-write { font-size: 11.5px; fill: var(--write); font-weight: 600; }
.t-online { fill: var(--online); font-weight: 600; }
.t-human { fill: var(--human); font-weight: 600; }
.t-db { font-family: var(--mono); font-size: 12px; font-weight: 600; fill: var(--db); }
.lane { fill: var(--lane); }
.tool { fill: var(--surface); stroke: var(--line); stroke-width: 1.6; }
.file { fill: var(--file); stroke: var(--line); stroke-width: 1; }
.db { fill: var(--tint-db); stroke: var(--db); stroke-width: 1.4; }
.online { fill: var(--tint-online); stroke: var(--online); stroke-width: 1.3; stroke-dasharray: 5 4; }
.human { fill: var(--tint-human); stroke: var(--human); stroke-width: 1.3; stroke-dasharray: 5 4; }
.lib { fill: var(--surface); stroke: var(--line); stroke-width: 1.6; }
.lib-w { fill: var(--tint-write); stroke: var(--write); stroke-width: 1.6; }
.flow { fill: none; stroke: var(--line); stroke-width: 1.4; }
.flow-w { fill: none; stroke: var(--write); stroke-width: 2.2; }
.flow-o { fill: none; stroke: var(--online); stroke-width: 1.4; }
.flow-d { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 4; }
.ah { fill: var(--line); }
.ah-w { fill: var(--write); }
.ah-o { fill: var(--online); }
</style>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0 L10 5 L0 10 z"/></marker><marker id="arr-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah-w" d="M0 0 L10 5 L0 10 z"/></marker><marker id="arr-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-o" d="M0 0 L10 5 L0 10 z"/></marker></defs>
<rect x="0" y="0" width="1250" height="490" fill="#ffffff"/>
<rect class="human" x="20" y="40" width="190" height="56" rx="5"/>
<text class="t-human" x="115.0" y="65.0" text-anchor="middle">Singers</text>
<text class="t-small" x="115.0" y="81.0" text-anchor="middle">logged-in users</text>
<rect class="human" x="20" y="130" width="190" height="56" rx="5"/>
<text class="t-human" x="115.0" y="155.0" text-anchor="middle">Contributors</text>
<text class="t-small" x="115.0" y="171.0" text-anchor="middle">review, genres, duplicates</text>
<rect class="human" x="20" y="220" width="190" height="56" rx="5"/>
<text class="t-human" x="115.0" y="245.0" text-anchor="middle">Admins</text>
<text class="t-small" x="115.0" y="261.0" text-anchor="middle">everything, users, settings</text>
<rect class="lane" x="250" y="14" width="470" height="300" rx="6"/>
<text class="t-lane" x="264" y="36">karaoke-dashboard</text>
<text class="t-label" x="264" y="52">FastAPI on the NAS, port 9713 behind a reverse proxy</text>
<rect class="tool" x="266" y="60" width="210" height="56" rx="5"/>
<text class="t-tool" x="371.0" y="85.0" text-anchor="middle">Songs · What&#x27;s new</text>
<text class="t-small" x="371.0" y="101.0" text-anchor="middle">browse, search, badges</text>
<rect class="tool" x="494" y="60" width="210" height="56" rx="5"/>
<text class="t-tool" x="599.0" y="85.0" text-anchor="middle">Genres</text>
<text class="t-small" x="599.0" y="101.0" text-anchor="middle">List, Map, Connections, Edit</text>
<rect class="tool" x="266" y="140" width="210" height="56" rx="5"/>
<text class="t-tool" x="371.0" y="165.0" text-anchor="middle">Report · Request</text>
<text class="t-small" x="371.0" y="181.0" text-anchor="middle">the public forms</text>
<rect class="tool" x="494" y="140" width="210" height="56" rx="5"/>
<text class="t-tool" x="599.0" y="165.0" text-anchor="middle">Reported · Requested</text>
<text class="t-small" x="599.0" y="181.0" text-anchor="middle">review, export, import</text>
<rect class="tool" x="266" y="220" width="210" height="56" rx="5"/>
<text class="t-tool" x="371.0" y="245.0" text-anchor="middle">Duplicates · Integrity</text>
<text class="t-small" x="371.0" y="261.0" text-anchor="middle">library checks</text>
<rect class="tool" x="494" y="220" width="210" height="56" rx="5"/>
<text class="t-tool" x="599.0" y="245.0" text-anchor="middle">Library scan</text>
<text class="t-small" x="599.0" y="261.0" text-anchor="middle">history and genres</text>
<path class="flow" d="M210 68 L266 88" marker-end="url(#arr)"/>
<path class="flow" d="M210 158 L266 168" marker-end="url(#arr)"/>
<path class="flow" d="M210 248 L266 248" marker-end="url(#arr)"/>
<rect class="db" x="266" y="380" width="438" height="56" rx="5"/>
<text class="t-db" x="485.0" y="405.0" text-anchor="middle">PostgreSQL</text>
<text class="t-small" x="485.0" y="421.0" text-anchor="middle">users, reports, requests, library history, genres, edits, settings</text>
<path class="flow" d="M485 314 L485 380" marker-end="url(#arr)" marker-start="url(#arr)"/>
<rect class="lib" x="20" y="380" width="190" height="56" rx="5"/>
<text class="t-tool" x="115.0" y="405.0" text-anchor="middle">Song library</text>
<text class="t-small" x="115.0" y="421.0" text-anchor="middle">NAS share, mounted read-only</text>
<path class="flow" d="M210 408 L230 408 L230 300 L250 300" marker-end="url(#arr)"/>
<text class="t-label" x="236" y="360" text-anchor="start">reads</text>
<rect class="online" x="780" y="40" width="450" height="76" rx="5"/>
<text class="t-online" x="1005.0" y="68.0" text-anchor="middle">USDX Song Factory</text>
<text class="t-small" x="1005.0" y="84.0" text-anchor="middle">broken.csv -&gt; repairs, song-requests.csv -&gt; new songs,</text>
<text class="t-small" x="1005.0" y="98.0" text-anchor="middle">genre-edits.tsv -&gt; #GENRE written; you copy the results in</text>
<rect class="online" x="780" y="150" width="450" height="56" rx="5"/>
<text class="t-online" x="1005.0" y="175.0" text-anchor="middle">UltraStar Manager</text>
<text class="t-small" x="1005.0" y="191.0" text-anchor="middle">opens the format-issues playlist (.upl)</text>
<rect class="online" x="780" y="236" width="450" height="56" rx="5"/>
<text class="t-online" x="1005.0" y="261.0" text-anchor="middle">scripts/</text>
<text class="t-small" x="1005.0" y="277.0" text-anchor="middle">apply_moves.sh, repair_library.py, fix_case_mismatches.py</text>
<path class="flow" d="M720 78 L780 78" marker-end="url(#arr)"/>
<path class="flow" d="M720 178 L780 178" marker-end="url(#arr)"/>
<path class="flow" d="M720 264 L780 264" marker-end="url(#arr)"/>
<path class="flow-w" d="M1005 292 L1005 470 L115 470 L115 436" marker-end="url(#arr-w)"/>
<text class="t-write" x="640" y="462" text-anchor="middle">results and fixes go into the library by hand</text>
<path class="flow-w" d="M1230 116 L1240 116 L1240 470 L1005 470" marker-end="url(#arr-w)"/>
</svg>
