<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 652" width="1250" height="652" role="img" aria-label="Singers report broken songs on /report and request songs on /request; both wait in Needs review until a contributor or admin admits them into the Reported or Requested list, which exports broken.csv and song-requests.csv. Saved into the USDX Song Factory&#x27;s stack/input, they become repaired and new songs; after a sing-test they are copied into the library. The next library scan marks the reports Updated since report and the contributor resolves them.">
<title>Reports and requests</title>
<style>svg { --bg: #f3f4f1; --surface: #ffffff; --fg: #1d2421; --muted: #5c6862; --line: #36403b; --rule: #d5dad5; --lane: #e8ebe6; --file: #f7f8f5; --online: #2f62a8; --human: #a86412; --write: #b3361f; --db: #2c7a57; --tint-online: #e6eef9; --tint-human: #fbefdf; --tint-write: #fbe7e2; --tint-db: #e2f1e9; --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif; --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
text { font-family: var(--body); font-size: 12px; fill: var(--fg); }
.t-tool { font-family: var(--mono); font-size: 13px; font-weight: 600; }
.t-file { font-family: var(--mono); font-size: 12px; font-weight: 500; }
.t-small { font-size: 11px; fill: var(--muted); }
.t-lane { font-family: var(--display); font-size: 15px; font-weight: 700; }
.t-label { font-size: 11px; fill: var(--muted); }
.t-write { font-size: 11.5px; fill: var(--write); font-weight: 600; }
.t-online { fill: var(--online); font-weight: 600; }
.t-human { fill: var(--human); font-weight: 600; }
.t-db { font-family: var(--mono); font-size: 12px; font-weight: 600; fill: var(--db); }
.lane { fill: var(--lane); }
.tool { fill: var(--surface); stroke: var(--line); stroke-width: 1.6; }
.file { fill: var(--file); stroke: var(--line); stroke-width: 1; }
.db { fill: var(--tint-db); stroke: var(--db); stroke-width: 1.4; }
.online { fill: var(--tint-online); stroke: var(--online); stroke-width: 1.3; stroke-dasharray: 5 4; }
.human { fill: var(--tint-human); stroke: var(--human); stroke-width: 1.3; stroke-dasharray: 5 4; }
.lib { fill: var(--surface); stroke: var(--line); stroke-width: 1.6; }
.lib-w { fill: var(--tint-write); stroke: var(--write); stroke-width: 1.6; }
.flow { fill: none; stroke: var(--line); stroke-width: 1.4; }
.flow-w { fill: none; stroke: var(--write); stroke-width: 2.2; }
.flow-o { fill: none; stroke: var(--online); stroke-width: 1.4; }
.flow-d { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 4; }
.ah { fill: var(--line); }
.ah-w { fill: var(--write); }
.ah-o { fill: var(--online); }
</style>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0 L10 5 L0 10 z"/></marker><marker id="arr-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah-w" d="M0 0 L10 5 L0 10 z"/></marker><marker id="arr-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-o" d="M0 0 L10 5 L0 10 z"/></marker></defs>
