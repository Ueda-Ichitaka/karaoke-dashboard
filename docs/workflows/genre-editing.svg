<rect class="online" x="716" y="130" width="240" height="70" rx="5"/>
<text class="t-online" x="836.0" y="148.0" text-anchor="middle">pull-genres --apply</text>
<text class="t-small" x="836.0" y="164.0" text-anchor="middle">copies the named song files</text>
<text class="t-small" x="836.0" y="178.0" text-anchor="middle">(no media) from the library</text>
<text class="t-small" x="836.0" y="192.0" text-anchor="middle">into input/genres/&lt;folder&gt;/</text>
<rect class="online" x="974" y="130" width="240" height="70" rx="5"/>
<text class="t-online" x="1094.0" y="148.0" text-anchor="middle">factory.sh genres</text>
<text class="t-small" x="1094.0" y="164.0" text-anchor="middle">one job per line: the first #GENRE</text>
<text class="t-small" x="1094.0" y="178.0" text-anchor="middle">replaced, encoding and</text>
<text class="t-small" x="1094.0" y="192.0" text-anchor="middle">line endings kept</text>
<path class="flow" d="M836 106 L836 130" marker-end="url(#arr)"/>
<path class="flow" d="M956 165 L974 165" marker-end="url(#arr)"/>
